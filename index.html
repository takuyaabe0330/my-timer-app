<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#0f172a">
  <title>スマートタイマー</title>
  <style>
    :root {
      --bg: #0f172a;
      --card-bg: #1e293b;
      --text: #f8fafc;
      --text-sub: #94a3b8;
      --primary: #38bdf8;
      --primary-active: #0284c7;
      --danger: #f43f5e;
      --danger-active: #e11d48;
      --btn-bg: #334155;
      --btn-active: #475569;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: max(16px, env(safe-area-inset-top)) 20px max(24px, env(safe-area-inset-bottom)) 20px;
      overflow: hidden;
    }

    /* 上部ヘッダー */
    header {
      text-align: center;
      padding-top: 10px;
    }

    h1 {
      font-size: 1.1rem;
      font-weight: 500;
      color: var(--text-sub);
      letter-spacing: 0.05em;
    }

    /* 中央ディスプレイ（リング ＋ 時間表示） */
    .timer-container {
      position: relative;
      width: min(72vw, 290px);
      height: min(72vw, 290px);
      margin: auto;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .progress-ring {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      transform: rotate(-90deg);
    }

    .progress-ring__circle-bg {
      stroke: var(--card-bg);
      stroke-width: 8;
      fill: transparent;
    }

    .progress-ring__circle {
      stroke: var(--primary);
      stroke-width: 8;
      stroke-linecap: round;
      fill: transparent;
      stroke-dasharray: 816.8;
      stroke-dashoffset: 0;
      transition: stroke-dashoffset 0.25s linear;
    }

    .time-display {
      display: flex;
      flex-direction: column;
      align-items: center;
      z-index: 1;
    }

    .time-text {
      font-size: min(18vw, 4.2rem);
      font-weight: 700;
      font-variant-numeric: tabular-nums;
      letter-spacing: -0.02em;
    }

    .status-text {
      font-size: 0.85rem;
      color: var(--text-sub);
      margin-top: 4px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    /* 下部：操作エリア（親指で届く範囲） */
    .controls-panel {
      display: flex;
      flex-direction: column;
      gap: 16px;
      width: 100%;
      max-width: 420px;
      margin: 0 auto;
    }

    /* プリセット時間ボタン */
    .preset-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
    }

    .btn-preset {
      background: var(--card-bg);
      color: var(--text);
      border: 1px solid rgba(255, 255, 255, 0.06);
      padding: 12px 0;
      border-radius: 12px;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.15s, transform 0.08s;
    }

    .btn-preset:active {
      background: var(--btn-active);
      transform: scale(0.96);
    }

    /* サブアクション（0:00クリア & リセット） */
    .sub-actions {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .btn-sub {
      background: var(--btn-bg);
      color: var(--text);
      border: none;
      padding: 14px 0;
      border-radius: 14px;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.15s, transform 0.08s;
    }

    .btn-sub:active {
      background: var(--btn-active);
      transform: scale(0.97);
    }

    /* メインボタン（スタート / 一時停止） */
    .btn-main {
      width: 100%;
      padding: 18px 0;
      border: none;
      border-radius: 18px;
      font-size: 1.25rem;
      font-weight: 700;
      letter-spacing: 0.05em;
      cursor: pointer;
      background: var(--primary);
      color: #0f172a;
      box-shadow: 0 8px 24px rgba(56, 189, 248, 0.25);
      transition: background 0.15s, transform 0.08s, box-shadow 0.15s;
    }

    .btn-main.running {
      background: var(--danger);
      color: #ffffff;
      box-shadow: 0 8px 24px rgba(244, 63, 94, 0.25);
    }

    .btn-main:active {
      transform: scale(0.98);
    }
  </style>
</head>
<body>

  <header>
    <h1>TIMER</h1>
  </header>

  <!-- 中央のタイマー表示 -->
  <div class="timer-container">
    <svg class="progress-ring" viewBox="0 0 280 280">
      <circle class="progress-ring__circle-bg" cx="140" cy="140" r="130"></circle>
      <circle id="progressCircle" class="progress-ring__circle" cx="140" cy="140" r="130"></circle>
    </svg>
    <div class="time-display">
      <span id="timeText" class="time-text">03:00</span>
      <span id="statusText" class="status-text">待機中</span>
    </div>
  </div>

  <!-- 下部の片手操作パネル -->
  <div class="controls-panel">
    <!-- プリセットボタン -->
    <div class="preset-grid">
      <button class="btn-preset" onclick="addSeconds(60)">+1分</button>
      <button class="btn-preset" onclick="addSeconds(180)">+3分</button>
      <button class="btn-preset" onclick="addSeconds(300)">+5分</button>
      <button class="btn-preset" onclick="addSeconds(600)">+10分</button>
    </div>

    <!-- クリア(0:00) & リセット -->
    <div class="sub-actions">
      <button class="btn-sub" onclick="clearToZero()">クリア (0:00)</button>
      <button class="btn-sub" onclick="resetTimer()">リセット</button>
    </div>

    <!-- スタート / ストップ -->
    <button id="mainBtn" class="btn-main" onclick="toggleTimer()">スタート</button>
  </div>

  <script>
    let totalSeconds = 180;      // セットされた初期時間（デフォルト3分）
    let remainingSeconds = 180;  // 残り時間
    let timerId = null;
    let isRunning = false;

    const timeText = document.getElementById('timeText');
    const statusText = document.getElementById('statusText');
    const mainBtn = document.getElementById('mainBtn');
    const circle = document.getElementById('progressCircle');

    const radius = 130;
    const circumference = 2 * Math.PI * radius; // 約816.81
    circle.style.strokeDasharray = `${circumference} ${circumference}`;

    // 時間表示とゲージの更新
    function updateDisplay() {
      const minutes = Math.floor(remainingSeconds / 60);
      const seconds = remainingSeconds % 60;
      timeText.textContent = `${String(minutes).padStart(2, '0')}:${String(seconds).padStart(2, '0')}`;

      // 円形プログレスバーの更新
      if (totalSeconds > 0) {
        const offset = circumference - (remainingSeconds / totalSeconds) * circumference;
        circle.style.strokeDashoffset = offset;
      } else {
        circle.style.strokeDashoffset = circumference;
      }
    }

    // スタート / 一時停止の切り替え
    function toggleTimer() {
      if (remainingSeconds <= 0) return;

      // 初回タップ時にオーディオコンテキストを初期化（iOS制限対策）
      initAudioContext();

      if (isRunning) {
        // 一時停止
        clearInterval(timerId);
        isRunning = false;
        mainBtn.textContent = '再開';
        mainBtn.classList.remove('running');
        statusText.textContent = '一時停止中';
      } else {
        // スタート
        isRunning = true;
        mainBtn.textContent = 'ストップ';
        mainBtn.classList.add('running');
        statusText.textContent = '計測中';

        timerId = setInterval(() => {
          if (remainingSeconds > 0) {
            remainingSeconds--;
            updateDisplay();
            if (remainingSeconds === 0) {
              timeUp();
            }
          }
        }, 1000);
      }
    }

    // 時間を追加（+1分など）
    function addSeconds(sec) {
      if (isRunning) return; // 計測中は誤操作防止
      remainingSeconds += sec;
      totalSeconds = remainingSeconds;
      statusText.textContent = '待機中';
      updateDisplay();
    }

    // 【追加機能】0:00に完全にクリア
    function clearToZero() {
      clearInterval(timerId);
      isRunning = false;
      totalSeconds = 0;
      remainingSeconds = 0;
      mainBtn.textContent = 'スタート';
      mainBtn.classList.remove('running');
      statusText.textContent = '未設定';
      updateDisplay();
    }

    // 直前にセットした時間に戻す（リセット）
    function resetTimer() {
      clearInterval(timerId);
      isRunning = false;
      remainingSeconds = totalSeconds;
      mainBtn.textContent = 'スタート';
      mainBtn.classList.remove('running');
      statusText.textContent = totalSeconds > 0 ? '待機中' : '未設定';
      updateDisplay();
    }

    // タイムアップ時の処理（音とバイブレーション）
    function timeUp() {
      clearInterval(timerId);
      isRunning = false;
      mainBtn.textContent = 'スタート';
      mainBtn.classList.remove('running');
      statusText.textContent = '時間です！';
      playAlarmSound();

      if ('vibrate' in navigator) {
        navigator.vibrate([300, 150, 300, 150, 500]);
      }
    }

    // 外部ファイル不要のピピピ音（Web Audio API）
    let audioCtx = null;
    function initAudioContext() {
      if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      }
      if (audioCtx.state === 'suspended') {
        audioCtx.resume();
      }
    }

    function playAlarmSound() {
      initAudioContext();
      const notes = [880, 880, 880, 1174.66]; // ピ・ピ・ピ・ピーン
      const times = [0, 0.15, 0.3, 0.45];

      notes.forEach((freq, i) => {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.connect(gain);
        gain.connect(audioCtx.destination);

        const startTime = audioCtx.currentTime + times[i];
        osc.frequency.setValueAtTime(freq, startTime);

        gain.gain.setValueAtTime(0.2, startTime);
        gain.gain.exponentialRampToValueAtTime(0.001, startTime + 0.12);

        osc.start(startTime);
        osc.stop(startTime + 0.13);
      });
    }

    // 初期化表示
    updateDisplay();
  </script>
</body>
</html>
